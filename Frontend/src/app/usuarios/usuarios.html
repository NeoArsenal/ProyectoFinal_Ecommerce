<div class="container">
  <h1 style="display: flex; align-items: center; gap: 8px;">
    <span class="material-symbols-outlined text-[28px] text-[#02696a]" aria-hidden="true">group</span> Gestión de Usuarios y Permisos
  </h1>

  <!-- FORMULARIO FLOTANTE DE ASIGNACIÓN -->
  <!-- Solo se muestra si hay un usuario seleccionado (*ngIf) -->
  <div class="formulario" *ngIf="usuarioSeleccionado" style="background: #e3f2fd; border: 1px solid #90caf9;">
    
    <h3 style="margin-top: 0; color: #1565c0;">
      Editando permisos de: <strong>{{ usuarioSeleccionado.email }}</strong>
    </h3>
    
    <div class="campo">
      <label for="sel-roles">Seleccionar Roles (Mantén presionado Ctrl para varios):</label>
      
      <!-- Select Múltiple -->
      <select id="sel-roles" multiple [(ngModel)]="rolesSeleccionados" style="height: 120px; padding: 5px;">
        <option *ngFor="let r of rolesDisponibles" [value]="r.id">
          {{ r.nombre }}
        </option>
      </select>
      
      <small style="color: #666; margin-top: 5px;">
        Haz clic en los roles para asignarlos o quitarlos.
      </small>
    </div>

    <div class="botones">
      <button (click)="guardarRoles()" class="btn-verde flex items-center gap-1 justify-center"><span class="material-symbols-outlined text-[18px]" aria-hidden="true">save</span> Guardar Cambios</button>
      <button (click)="usuarioSeleccionado = null" class="btn-gris">Cancelar</button>
    </div>
  </div>

  <hr *ngIf="usuarioSeleccionado">

  <!-- TABLA DE USUARIOS -->
  <table >
    <thead>
      <tr>
        <th>ID</th>
        <th>Email</th>
        <th>Roles Actuales</th>
        <th>Acción</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let u of usuarios">
        <td class="center">{{ u.id }}</td>
        <td>{{ u.email }}</td>
        
        <!-- COLUMNA DE ROLES (Aquí está la magia) -->
        <td>
            <!-- Si tiene roles, los mostramos como etiquetas azules -->
            <span *ngFor="let rol of u.rolesNombres" class="badge-rol">
                {{ rol }}
            </span>

            <!-- Si no tiene roles o la lista es nula, mostramos aviso gris -->
            <span *ngIf="!u.rolesNombres?.length" style="color:#999; font-size: 11px; font-style: italic;">
                (Sin roles asignados)
            </span>
        </td>
        
        <td class="center">
          <button (click)="seleccionar(u)" class="btn-azul-sm flex items-center gap-1 mx-auto" aria-label="Asignar roles al usuario">
            <span class="material-symbols-outlined text-[16px]" aria-hidden="true">shield</span> Asignar Roles
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
