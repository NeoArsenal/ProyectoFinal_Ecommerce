<div class="container">
  <h1 style="display: flex; align-items: center; gap: 8px;">
    <span class="material-symbols-outlined text-[1.75rem] text-[#02696a]" aria-hidden="true">local_shipping</span> Métodos de Envío
  </h1>

  <div class="formulario">
    <div class="campo">
      <label for="inp-nuevo-metodo">NUEVO MÉTODO:</label>
      <input id="inp-nuevo-metodo" type="text" [(ngModel)]="nombreNuevo" placeholder="Ej: Aéreo Express">
    </div>
    <button (click)="guardar()" class="btn-guardar" [disabled]="!nombreNuevo">Agregar</button>
  </div>

  <table >
    <thead>
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Acción</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let m of metodos">
        <td class="center">{{ m.id }}</td>
        <td>{{ m.nombre }}</td>
        <td class="center">
          <button (click)="borrar(m.id)" class="btn-borrar" aria-label="Eliminar método">X</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
