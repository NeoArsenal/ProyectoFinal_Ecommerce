<div class="container">
  <h1 style="display: flex; align-items: center; gap: 8px;">
    <span class="material-symbols-outlined text-[28px] text-[#02696a]" aria-hidden="true">sell</span> Gestión de Categorías
  </h1>

  <!-- Formulario -->
  <form [formGroup]="form" (ngSubmit)="guardar()" class="formulario">
    <div class="campo">
      <label for="inp-nombre">Nombre:</label>
      <input id="inp-nombre" type="text" formControlName="nombre" placeholder="Ej: Ropa">
    </div>
    <div class="campo">
      <label for="inp-desc">Descripción:</label>
      <input id="inp-desc" type="text" formControlName="descripcion" placeholder="Ej: Polos y pantalones">
    </div>
    <button type="submit" [disabled]="form.invalid" class="btn-guardar">Guardar</button>
  </form>

  <hr>

  <!-- Tabla -->
  <table >
    <thead>
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Descripción</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let c of categorias">
        <td class="center">{{ c.id }}</td>
        <td>{{ c.nombre }}</td>
        <td>{{ c.descripcion }}</td>
      </tr>
    </tbody>
  </table>
</div>
