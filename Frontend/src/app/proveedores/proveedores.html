<div class="container">
  <h1>Gestión de Proveedores</h1>

  <!-- Formulario -->
  <form [formGroup]="form" (ngSubmit)="guardar()" class="formulario">
    <input type="hidden" formControlName="id">

    <div class="campo">
      <label for="inp-empresa">Empresa:</label>
      <input id="inp-empresa" type="text" formControlName="empresa" placeholder="Ej: Sony Corp" [class.input-error]="empresaCtl?.touched && empresaCtl?.invalid">
      <small *ngIf="empresaCtl?.touched && empresaCtl?.errors?.['required']" class="error msg-error" role="alert" aria-live="polite">Requerido</small>
      <small *ngIf="empresaCtl?.touched && empresaCtl?.errors?.['minlength']" class="error msg-error" role="alert" aria-live="polite">Mínimo 3 letras</small>
    </div>

    <div class="campo">
      <label for="inp-contacto">Contacto:</label>
      <input id="inp-contacto" type="text" formControlName="contacto" placeholder="Ej: Juan Pérez" [class.input-error]="contactoCtl?.touched && contactoCtl?.invalid">
      <small *ngIf="contactoCtl?.touched && contactoCtl?.errors?.['required']" class="error msg-error" role="alert" aria-live="polite">Requerido</small>
      <small *ngIf="contactoCtl?.touched && contactoCtl?.errors?.['minlength']" class="error msg-error" role="alert" aria-live="polite">Mínimo 3 letras</small>
      <small *ngIf="contactoCtl?.touched && contactoCtl?.errors?.['pattern']" class="error msg-error" role="alert" aria-live="polite">Solo letras válidas</small>
    </div>

    <div class="campo">
      <label for="inp-telefono">Teléfono:</label>
      <input id="inp-telefono" type="text" formControlName="telefono" placeholder="Ej: 999888777" [class.input-error]="telCtl?.touched && telCtl?.invalid">
      <small *ngIf="telCtl?.touched && telCtl?.errors?.['required']" class="error msg-error" role="alert" aria-live="polite">Requerido</small>
      <small *ngIf="telCtl?.touched && telCtl?.errors?.['pattern']" class="error msg-error" role="alert" aria-live="polite">Debe tener 7 a 9 números exactos</small>
    </div>

    <div class="botones">
      <button type="submit" [disabled]="form.invalid" [class.btn-edit]="esEdicion">
        {{ esEdicion ? 'Actualizar' : 'Registrar' }}
      </button>
      <button type="button" (click)="limpiar()" class="btn-limpiar">Limpiar</button>
    </div>
  </form>

  <hr>

  <!-- Tabla -->
  <table >
    <thead>
      <tr>
        <th>ID</th>
        <th>Empresa</th>
        <th>Contacto</th>
        <th>Teléfono</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let p of proveedores">
        <td>{{ p.id }}</td>
        <td>{{ p.empresa }}</td>
        <td>{{ p.contacto }}</td>
        <td>{{ p.telefono }}</td>
        <td>
          <button (click)="editar(p)" class="btn-azul">Editar</button>
          <button (click)="borrar(p.id)" class="btn-rojo">Eliminar</button>
        </td>
      </tr>
      <tr *ngIf="proveedores.length === 0">
        <td colspan="5" style="text-align:center">No hay proveedores registrados.</td>
      </tr>
    </tbody>
  </table>
</div>
