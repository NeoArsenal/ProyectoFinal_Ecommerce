<div class="container">
  <h1 style="display: flex; align-items: center; gap: 8px;">
    <span class="material-symbols-outlined text-[1.75rem] text-[#02696a]" aria-hidden="true">admin_panel_settings</span> Gestión de Roles (Seguridad)
  </h1>

  <div class="formulario">
    <div class="campo">
      <label for="inp-nuevo-rol">Nuevo Rol:</label>
      <input id="inp-nuevo-rol" type="text" [(ngModel)]="nombreNuevo" placeholder="Ej: ADMIN, SUPERVISOR">
    </div>
    <button (click)="guardar()" class="btn-guardar" [disabled]="!nombreNuevo">Crear Rol</button>
  </div>

  <table >
    <thead>
      <tr>
        <th>ID</th>
        <th>Rol</th>
        <th>Acción</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let r of roles">
        <td class="center">{{ r.id }}</td>
        <td>{{ r.nombre }}</td>
        <td class="center">
          <button (click)="borrar(r.id)" class="btn-borrar" aria-label="Eliminar rol">X</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
